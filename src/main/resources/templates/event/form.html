<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.id == null ? 'Nuevo evento' : 'Editar evento'}">Evento</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1 th:text="${event.id == null ? 'Nuevo evento' : 'Editar evento'}">Evento</h1>
        <a th:href="@{/event/list}" class="btn-small">← Volver</a>
    </header>

    <main>
        <section class="card card--form">

            <form th:action="@{__${event.id == null ? '/event/create' : '/event/update/' + event.id}__}"
                  method="post" class="form">

                <div class="field">
                    <input type="text" id="name" name="name"
                           placeholder=" " th:value="${event.name}" required>
                    <label for="name">Nombre del evento *</label>
                </div>

                <div class="field field--textarea">
                    <textarea id="description" name="description" rows="3"
                              placeholder=" " maxlength="600" data-counter
                              th:text="${event.description}"></textarea>
                    <label for="description">Descripción</label>
                    <span class="char-counter"></span>
                </div>

                <div class="field">
                    <input type="date" id="date" name="date"
                           placeholder=" "
                           th:value="${event.date != null ? #dates.format(event.date, 'yyyy-MM-dd') : ''}">
                    <label for="date">Fecha</label>
                </div>

                <p class="form-section-title">Espacio físico</p>

                <div class="field">
                    <input type="text" id="spaceName" name="physicalSpace.name"
                           placeholder=" "
                           th:value="${event.physicalSpace != null ? event.physicalSpace.name : ''}">
                    <label for="spaceName">Nombre del espacio</label>
                </div>

                <div class="field">
                    <input type="text" id="spaceLocation" name="physicalSpace.location"
                           placeholder=" "
                           th:value="${event.physicalSpace != null ? event.physicalSpace.location : ''}">
                    <label for="spaceLocation">Ubicación</label>
                </div>

                <div class="field">
                    <input type="number" id="spaceCapacity" name="physicalSpace.capacity"
                           placeholder=" "
                           th:value="${event.physicalSpace != null ? event.physicalSpace.capacity : ''}">
                    <label for="spaceCapacity">Capacidad</label>
                </div>

                <button type="submit" class="btn"
                        th:text="${event.id == null ? 'Crear evento' : 'Actualizar evento'}">Guardar</button>
            </form>

        </section>
    </main>

</div>

<script>
(function () {
    document.querySelectorAll('textarea[data-counter]').forEach(function (ta) {
        var wrapper = ta.closest('.field--textarea');
        var counter = wrapper ? wrapper.querySelector('.char-counter') : null;
        if (!counter) return;
        var max = ta.maxLength > 0 ? ta.maxLength : 500;
        function update() {
            var len = ta.value.length;
            counter.textContent = len + ' / ' + max;
            counter.classList.toggle('near-limit', len >= max * 0.9);
        }
        ta.addEventListener('input', update);
        update();
    });
})();
</script>

</body>
</html>

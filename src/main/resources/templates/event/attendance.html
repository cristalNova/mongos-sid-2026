<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>
        <div class="user-list">

            <div class="list-header">
                <div>
                    <h2 th:text="${event.name}">Evento</h2>
                    <small th:text="${event.date != null ? #dates.format(event.date, 'dd/MM/yyyy') : ''}"></small>
                </div>
                <a th:href="@{/event/list}" class="btn-small">← Volver</a>
            </div>

            <!-- Attendance summary bar -->
            <div class="attendance-summary" th:if="${totalCount > 0}">

                <div class="attendance-stat">
                    <div class="att-value" th:text="${attendedCount}">0</div>
                    <div class="att-label">Asistieron</div>
                </div>

                <div class="attendance-stat">
                    <div class="att-value" th:text="${totalCount}">0</div>
                    <div class="att-label">Inscritos</div>
                </div>

                <div class="attendance-bar-wrapper">
                    <div class="att-label">
                        <span>Asistencia</span>
                        <span th:text="${attendancePct + '%'}">0%</span>
                    </div>
                    <div class="attendance-bar-track">
                        <div class="attendance-bar-fill"
                             th:style="'width:' + ${attendancePct} + '%'"></div>
                    </div>
                </div>

            </div>

            <div th:if="${#lists.isEmpty(event.subscriptions)}"
                 th:replace="fragments/empty-state :: empty('Este evento no tiene inscritos aún.', null)">
            </div>

            <div class="user-row" th:each="sub : ${event.subscriptions}">

                <div class="info">
                    <strong th:text="${sub.userFirstName + ' ' + sub.userLastName}"></strong>
                </div>

                <div class="roles">
                    <span th:class="${'chip ' + (sub.attendance ? 'chip--success' : 'chip--danger')}"
                          th:text="${sub.attendance ? '✓ Asistió' : 'No marcado'}"></span>
                </div>

                <div class="actions">
                    <form th:if="${!sub.attendance}"
                          th:action="@{'/event/' + ${event.id} + '/attendance'}" method="post">
                        <input type="hidden" name="userId" th:value="${sub.userId}">
                        <input type="hidden" name="attended" value="true">
                        <button class="btn-small btn-small--success">Marcar asistencia</button>
                    </form>
                    <form th:if="${sub.attendance}"
                          th:action="@{'/event/' + ${event.id} + '/attendance'}" method="post">
                        <input type="hidden" name="userId" th:value="${sub.userId}">
                        <input type="hidden" name="attended" value="false">
                        <button class="btn-small btn-small--muted">Quitar asistencia</button>
                    </form>
                </div>

            </div>

        </div>
    </main>

</div>

</body>
</html>

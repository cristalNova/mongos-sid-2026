<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>

        <div class="user-list">

            <div class="list-header">
                <h2>Eventos</h2>
                <a sec:authorize="hasAuthority('MANAGE_USERS')"
                   th:href="@{/event/new}" class="btn-small">+ Nuevo evento</a>
            </div>

            <form class="search-bar" method="get" th:action="@{/event/list}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar evento…" autocomplete="off">
                <button type="submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Buscar
                </button>
                <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/event/list}" class="clear-search">Limpiar</a>
            </form>

            <p th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info"
               th:text="'Resultados para: «' + ${q} + '»  (' + ${#lists.size(events)} + ' encontrados)'"></p>

            <div class="user-row" th:each="event : ${events}">

                <div class="info">
                    <strong th:text="${event.name}"></strong>
                    <small th:text="${event.description}"></small>
                    <small th:if="${event.physicalSpace != null}"
                           th:text="${'📍 ' + event.physicalSpace.name + ' — ' + event.physicalSpace.location}"></small>
                </div>

                <div class="roles">
                    <span class="chip" th:text="${event.date != null ? #dates.format(event.date, 'dd/MM/yyyy') : '—'}"></span>
                    <span class="chip" th:text="${#lists.size(event.subscriptions) + ' inscripciones'}"></span>
                    <span th:class="${'chip ' + (subscribedEventIds.contains(event.id) ? 'chip--success' : 'chip--danger')}"
                          th:text="${subscribedEventIds.contains(event.id) ? '✓ Inscrito' : 'No inscrito'}"></span>
                </div>

                <div class="actions">

                    <form th:if="${!subscribedEventIds.contains(event.id)}"
                          th:action="@{'/event/' + ${event.id} + '/subscribe'}" method="post">
                        <button class="btn-small btn-small--success">Inscribirme</button>
                    </form>

                    <form th:if="${subscribedEventIds.contains(event.id)}"
                          th:action="@{'/event/' + ${event.id} + '/unsubscribe'}" method="post">
                        <button class="btn-small btn-small--danger">Cancelar inscripción</button>
                    </form>

                    <a sec:authorize="hasAuthority('MANAGE_USERS')"
                       th:if="${!#lists.isEmpty(event.subscriptions)}"
                       th:href="@{'/event/' + ${event.id} + '/attendance'}"
                       class="btn-small btn-small--accent">Asistencia</a>

                    <a sec:authorize="hasAuthority('MANAGE_USERS')"
                       th:href="@{'/event/edit/' + ${event.id}}" class="btn-small">Editar</a>

                    <form sec:authorize="hasAuthority('MANAGE_USERS')"
                          th:action="@{'/event/delete/' + ${event.id}}" method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar este evento? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>

                </div>

            </div>

            <div th:if="${#lists.isEmpty(events)}"
                 th:replace="fragments/empty-state :: empty('No hay eventos registrados.', 'Pronto se publicarán nuevos eventos.')">
            </div>

        </div>

    </main>

</div>

</body>
</html>

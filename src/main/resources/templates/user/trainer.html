<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trainer Assignment</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>

<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1>Assign Trainer</h1>

        <a th:href="@{/user/list}" class="btn-small">Back</a>
    </header>

    <main>

        <section class="card">

            <h2 th:text="${user.firstName + ' ' + user.lastName}"></h2>

            <form th:action="@{'/user/' + ${user.id} + '/trainer/assign'}"
                  method="post">

                <label>Trainer ID</label>
                <input type="number" name="trainerId" required>

                <button class="btn">Assign</button>

            </form>

        </section>

    </main>

</div>

</body>
</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar entrenador</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>

<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1>Asignar entrenador</h1>
        <a th:href="@{/user/list}" class="btn-small">Volver</a>
    </header>

    <main>
        <section class="card">

            <h2 th:text="${user.firstName + ' ' + user.lastName}"></h2>

            <div th:if="${user.trainers != null and not #lists.isEmpty(user.trainers)}" class="section-block">
                <strong>Entrenadores asignados:</strong>
                <div th:each="t : ${user.trainers}" class="list-item-row">
                    <span th:text="${t.firstName + ' ' + t.lastName + ' (' + t.email + ')'}"></span>
                    <form th:action="@{'/user/' + ${user.id} + '/trainer/remove'}" method="post" class="form-zero">
                        <input type="hidden" name="trainerId" th:value="${t.id}">
                        <button class="btn-xs danger" onclick="return confirm('¿Retirar entrenador?')">Retirar</button>
                    </form>
                </div>
            </div>

            <form th:action="@{'/user/' + ${user.id} + '/trainer/assign'}" method="post" class="form">

                <label>Seleccionar entrenador</label>
                <select name="trainerId" required>
                    <option value="" disabled selected>— Selecciona un entrenador —</option>
                    <option th:each="t : ${trainers}"
                            th:value="${t.id}"
                            th:text="${t.firstName + ' ' + t.lastName + ' (' + t.email + ')'}"></option>
                </select>

                <p th:if="${#lists.isEmpty(trainers)}" class="text-muted">
                    No hay entrenadores registrados. Asigna el rol TRAINER a un usuario primero.
                </p>

                <button class="btn" th:disabled="${#lists.isEmpty(trainers)}">Asignar</button>
            </form>

        </section>
    </main>

</div>

</body>
</html>

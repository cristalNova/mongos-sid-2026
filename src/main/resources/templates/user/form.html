<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>

    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
</head>

<body>

<div class="page-wrapper">

    <!-- TOPBAR -->
    <header class="topbar">

        <h1>Edit User</h1>

        <a th:href="@{/user/list}" class="btn-small">Back</a>

    </header>

    <!-- CONTENT -->
    <main>

        <section class="card">

            <h2>User Information</h2>

            <form th:action="@{'/user/update/' + ${user.id}}"
                  method="post"
                  class="form">

                <!-- FIRST NAME -->
                <label>First name</label>
                <input type="text"
                       name="firstName"
                       th:value="${user.firstName}"
                       required>

                <!-- LAST NAME -->
                <label>Last name</label>
                <input type="text"
                       name="lastName"
                       th:value="${user.lastName}"
                       required>

                <!-- EMAIL -->
                <label>Email</label>
                <input type="email"
                       name="email"
                       th:value="${user.email}"
                       required>

                <!-- PASSWORD -->
                <label>Password (leave empty if not changing)</label>
                <input type="password"
                       name="password"
                       placeholder="New password">

                <!-- AGE -->
                <label>Age</label>
                <input type="number"
                       name="age"
                       th:value="${user.age}">

                <!-- WEIGHT -->
                <label>Weight</label>
                <input type="number"
                       step="0.1"
                       name="weight"
                       th:value="${user.weight}">

                <!-- HEIGHT -->
                <label>Height</label>
                <input type="number"
                       step="0.1"
                       name="height"
                       th:value="${user.height}">


                <!-- SUBMIT -->
                <button type="submit" class="btn">
                    Update user
                </button>

            </form>

        </section>

    </main>

</div>

</body>
</html>

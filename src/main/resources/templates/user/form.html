<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>

<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1>Editar usuario</h1>
        <a th:href="@{/user/list}" class="btn-small">← Volver</a>
    </header>

    <main>
        <section class="card card--form">

            <form th:action="@{'/user/update/' + ${user.id}}"
                  method="post"
                  class="form">

                <div class="field">
                    <input type="text" id="firstName" name="firstName"
                           placeholder=" " th:value="${user.firstName}" required>
                    <label for="firstName">Nombre *</label>
                </div>

                <div class="field">
                    <input type="text" id="lastName" name="lastName"
                           placeholder=" " th:value="${user.lastName}" required>
                    <label for="lastName">Apellido *</label>
                </div>

                <div class="field">
                    <input type="email" id="email" name="email"
                           placeholder=" " th:value="${user.email}" required>
                    <label for="email">Email *</label>
                </div>

                <div class="field">
                    <input type="password" id="password" name="password" placeholder=" ">
                    <label for="password">Contraseña (dejar vacío para no cambiar)</label>
                </div>

                <div class="field">
                    <input type="number" id="age" name="age"
                           placeholder=" " th:value="${user.age}">
                    <label for="age">Edad</label>
                </div>

                <div class="field">
                    <input type="number" id="weight" name="weight"
                           placeholder=" " step="0.1" th:value="${user.weight}">
                    <label for="weight">Peso (kg)</label>
                </div>

                <div class="field">
                    <input type="number" id="height" name="height"
                           placeholder=" " step="0.1" th:value="${user.height}">
                    <label for="height">Altura (cm)</label>
                </div>

                <button type="submit" class="btn">Guardar cambios</button>

            </form>

        </section>

    </main>

</div>

</body>
</html>

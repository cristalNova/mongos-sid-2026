<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
</head>

<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>

        <div class="user-list">

            <div class="list-header">
                <h2>Usuarios</h2>
            </div>

            <form class="search-bar" method="get" th:action="@{/user/list}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar por nombre o email…" autocomplete="off">
                <button type="submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Buscar
                </button>
                <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/user/list}" class="clear-search">Limpiar</a>
            </form>

            <p th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info"
               th:text="'Resultados para: «' + ${q} + '»  (' + ${#lists.size(users)} + ' encontrados)'"></p>

            <div class="user-row" th:each="user : ${users}">

                <!-- INFO -->
                <div class="info">
                    <strong th:text="${user.firstName + ' ' + user.lastName}"></strong>
                    <small th:text="${user.email}"></small>
                </div>

                <!-- ROLES -->
                <div class="roles">
                    <span class="chip" th:each="role : ${user.roles}"
                          th:text="${role.name}"></span>
                </div>

                <div class="actions">

                    <a sec:authorize="hasAuthority('MANAGE_USERS')"
                       th:href="@{'/user/edit/' + ${user.id}}" class="btn-small">
                        Edit
                    </a>

                    <form sec:authorize="hasAuthority('MANAGE_USERS')"
                          th:action="@{'/user/delete/' + ${user.id}}" method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar este usuario? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>

                    <a sec:authorize="hasAuthority('MANAGE_ROLES')"
                       th:href="@{'/user/' + ${user.id} + '/roles'}" class="btn-small">
                        Roles
                    </a>

                    <a sec:authorize="hasAuthority('ASSIGN_TRAINER')"
                       th:if="${#lists.contains(user.roles.![name], 'USER')}"
                       th:href="@{'/user/' + ${user.id} + '/trainer'}"
                       class="btn-small">
                        Assign Trainer
                    </a>

                </div>

            </div>

            <div th:if="${#lists.isEmpty(users)}"
                 th:replace="fragments/empty-state :: empty('No se encontraron usuarios.', null)">
            </div>

        </div>

    </main>

</div>

</body>
</html>

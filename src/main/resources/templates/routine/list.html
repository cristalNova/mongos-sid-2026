<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Rutinas</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>

        <div class="user-list">

            <div class="list-header">
                <h2>Rutinas</h2>
                <div class="list-actions">
                    <a th:href="@{/routine/list}" class="btn-small">Públicas</a>
                    <a th:href="@{/routine/mine}" class="btn-small">Mis rutinas</a>
                    <a th:href="@{/routine/new}" class="btn-small">+ Nueva</a>
                </div>
            </div>

            <form class="search-bar" method="get" th:action="@{/routine/list}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar rutina…" autocomplete="off">
                <button type="submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Buscar
                </button>
                <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/routine/list}" class="clear-search">Limpiar</a>
            </form>

            <p th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info"
               th:text="'Resultados para: «' + ${q} + '»  (' + ${#lists.size(routines)} + ' encontrados)'"></p>

            <div class="user-row" th:each="routine : ${routines}">

                <div class="info">
                    <strong th:text="${routine.routineName}"></strong>
                    <small th:text="${routine.type + ' · ' + routine.difficultyType}"></small>
                    <small th:text="'Creada por: ' + ${routine.ownerFirstName + ' ' + routine.ownerLastName}"></small>
                </div>

                <div class="roles">
                    <span th:class="${'chip ' + (routine.visibility ? 'chip--success' : 'chip--danger')}"
                          th:text="${routine.visibility ? 'Pública' : 'Privada'}"></span>
                    <span class="chip" th:text="${#lists.size(routine.exercises) + ' ejercicios'}"></span>
                </div>

                <div class="actions">

                    <a th:href="@{'/routine/' + ${routine.id} + '/exercises'}" class="btn-small">
                        Ejercicios
                    </a>

                    <a th:if="${!routine.visibility}"
                       th:href="@{'/routine/edit/' + ${routine.id}}"
                       class="btn-small">
                        Editar
                    </a>

                    <a sec:authorize="hasAuthority('MANAGE_ROUTINES')"
                       th:href="@{'/routine/edit/' + ${routine.id}}"
                       class="btn-small">
                        Editar
                    </a>

                    <form th:if="${routine.visibility}"
                          th:action="@{'/routine/' + ${routine.id} + '/adopt'}"
                          method="post"
                          class="form-inline">
                        <button type="button" class="btn-small btn-small--accent"
                                data-confirm="¿Adoptar esta rutina a tus rutinas personales?">
                            Adoptar
                        </button>
                    </form>

                    <form th:if="${!routine.visibility}"
                          th:action="@{'/routine/delete/' + ${routine.id}}"
                          method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar esta rutina? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>

                    <form sec:authorize="hasAuthority('MANAGE_ROUTINES')"
                          th:action="@{'/routine/delete/' + ${routine.id}}"
                          method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar esta rutina? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>

                </div>

            </div>

            <div th:if="${#lists.isEmpty(routines)}"
                 th:replace="fragments/empty-state :: empty('No hay rutinas disponibles.', 'Crea la primera con el botón + Nueva.')">
            </div>

        </div>

    </main>

</div>

</body>
</html>

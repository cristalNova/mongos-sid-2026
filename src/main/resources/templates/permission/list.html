<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permisos</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>
        <div class="user-list">

            <div class="list-header">
                <h2>Permisos</h2>
                <a th:href="@{/permission/create}" class="btn-small">+ Nuevo permiso</a>
            </div>

            <div class="user-row" th:each="permission : ${permissions}">

                <div class="info">
                    <strong th:text="${permission.name}"></strong>
                </div>

                <div class="actions">
                    <a th:href="@{'/permission/edit/' + ${permission.id}}" class="btn-small">Editar</a>
                    <form th:action="@{'/permission/delete/' + ${permission.id}}" method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar este permiso? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>
                </div>

            </div>

            <div th:if="${#lists.isEmpty(permissions)}"
                 th:replace="fragments/empty-state :: empty('No hay permisos registrados.', null)">
            </div>

        </div>
    </main>

</div>

</body>
</html>

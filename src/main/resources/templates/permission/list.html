<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Permissions</title>

    <link rel="stylesheet" th:href="@{/css/permission.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
</head>

<body>

<div class="page-wrapper">

    <!-- TOPBAR -->
    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <!-- CONTENT -->
    <main class="content">

        <!-- CREATE BUTTON -->
        <div class="actions-bar">
            <a th:href="@{/permission/create}" class="btn">+ New Permission</a>
        </div>

        <!-- LIST -->
        <section class="list">

            <div class="row" th:each="permission : ${permissions}">

                <div class="info">
                    <strong th:text="${permission.name}"></strong>
                </div>

                <div class="actions">

                    <!-- EDIT -->
                    <a th:href="@{'/permission/edit/' + ${permission.id}}"
                       class="btn-small">
                        Edit
                    </a>

                    <!-- DELETE -->
                    <form th:action="@{'/permission/delete/' + ${permission.id}}"
                          method="post">

                        <button class="danger"
                                onclick="return confirm('Delete permission?')">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>

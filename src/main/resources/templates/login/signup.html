    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <title>Sign Up</title>
</head>
<body>
<form th:action="@{/user/signup}" th:object="${user}" method="post" id="sign-up-form">

    <!--
        "*{name}" para referenciar un atributo
        th:if=
        th:else=
        th:each="-:-"
    -->

    <p class="title">Sign up</p>

    <div class="pair-input">
        <div>
            <label for="firstName">First Name</label>

            <input type="text" name="firstName" placeholder="First Name" id="firstName">
        </div>
        <div>
            <label for="lastName">Last Name</label>

            <input type="text" name="lastName" placeholder="Last Name" id="lastName">
        </div>
    </div>

    <div class="pair-input">

        <div>
            <label for="email">Email</label>

            <input type="text" name="email" placeholder="Email" id="email">
        </div>
        <div>
            <label for="psswd">Password</label>

            <input type="password" name="password" placeholder="Password" id="psswd">
        </div>
    </div>
    <div class="pair-input">
        <div>
            <label for="weight">Weight</label>

            <input type="number" name="weight" placeholder="Weight" id="weight">
        </div>
        <div>
            <label for="height">Height</label>

            <input type="number" name="height" placeholder="Height" id="height">
        </div>

    </div>

    <div class="pair-input">
        <div>
            <label for="age">Age</label>

            <input type="number" name="age" placeholder="Age" id="age">
        </div>
        <div></div>
    </div>


    <button type="submit">Create Account</button>

</form>

<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso del estudiante</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>
        <div class="user-list">

            <div style="padding:1rem 0; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h2 style="margin:0;" th:text="'Progreso de ' + ${student.firstName + ' ' + student.lastName}"></h2>
                    <small th:text="${student.email}" style="color:#888;"></small>
                </div>
                <div style="display:flex; gap:0.5rem;">
                    <a th:href="@{'/recommendation/new?receiverId=' + ${student.id}}" class="btn-small"
                       style="background:#5a3e8a; color:#fff;">Recomendar</a>
                    <a th:href="@{/user/my-students}" class="btn-small">Volver</a>
                </div>
            </div>

            <div class="user-row" th:each="record : ${records}">
                <div class="info">
                    <strong th:text="${record.exerciseName != null ? record.exerciseName : '—'}"></strong>
                    <small th:text="'Rutina: ' + ${record.routineName}"></small>
                    <small th:text="${record.progressNotes}"></small>
                </div>
                <div class="roles">
                    <span class="chip" th:text="${record.date != null ? #dates.format(record.date,'dd/MM/yyyy') : '—'}"></span>
                    <span class="chip" th:text="${record.series + ' series × ' + record.repetitions + ' reps'}"></span>
                    <span class="chip" th:if="${record.weight != null}" th:text="${record.weight + ' kg'}"></span>
                </div>
            </div>

            <p th:if="${#lists.isEmpty(records)}" style="color:#888; padding:1rem;">
                Este estudiante no tiene registros de progreso.
            </p>

        </div>
    </main>

</div>

</body>
</html>

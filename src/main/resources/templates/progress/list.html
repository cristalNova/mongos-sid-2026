<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi progreso</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>

        <div class="user-list">

            <div class="list-header">
                <h2>Mi progreso</h2>
                <div class="list-actions">
                    <a th:href="@{/progress/stats}" class="btn-small">Estadísticas</a>
                    <a th:href="@{/progress/export/pdf}" class="btn-small btn-small--danger">Exportar PDF</a>
                    <a th:href="@{/progress/export/csv(q=${q})}" class="btn-small btn-small--danger">
                        Export CSV</a>
                    <a th:href="@{/progress/new}" class="btn-small">+ Nuevo registro</a>
                </div>
            </div>

            <form class="search-bar" method="get" th:action="@{/progress/list}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar por ejercicio o rutina…" autocomplete="off">
                <button type="submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Buscar
                </button>
                <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/progress/list}" class="clear-search">Limpiar</a>
            </form>

            <p th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info"
               th:text="'Resultados para: «' + ${q} + '»  (' + ${#lists.size(records)} + ' encontrados)'"></p>

            <div class="user-row" th:each="record : ${records}">

                <div class="info">
                    <strong th:text="${record.exerciseName != null ? record.exerciseName : '—'}"></strong>
                    <small th:text="'Rutina: ' + ${record.routineName}"></small>
                    <small th:text="${record.progressNotes}"></small>
                </div>

                <div class="roles">
                    <span class="chip" th:text="${record.date != null ? #dates.format(record.date,'dd/MM/yyyy') : '—'}"></span>
                    <span class="chip" th:text="${record.series + ' series × ' + record.repetitions + ' reps'}"></span>
                    <span class="chip" th:if="${record.weight != null}"
                          th:text="${record.weight + ' kg'}"></span>
                </div>

                <div class="actions">
                    <a th:href="@{'/progress/edit/' + ${record.id}}" class="btn-small">Editar</a>
                    <form th:action="@{'/progress/delete/' + ${record.id}}" method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar este registro de progreso?">
                            Eliminar
                        </button>
                    </form>
                </div>

            </div>

            <div th:if="${#lists.isEmpty(records)}"
                 th:replace="fragments/empty-state :: empty('No tienes registros de progreso.', 'Comienza registrando tu primera sesión con + Nuevo registro.')">
            </div>

        </div>

    </main>

</div>

</body>
</html>

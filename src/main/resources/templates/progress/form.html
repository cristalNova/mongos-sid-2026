<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${record.id == null ? 'Nuevo registro' : 'Editar registro'}">Progreso</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1 th:text="${record.id == null ? 'Nuevo registro' : 'Editar registro'}">Progreso</h1>
        <a th:href="@{/progress/list}" class="btn-small">← Volver</a>
    </header>

    <main>
        <section class="card card--form">

            <form th:action="@{__${record.id == null ? '/progress/create' : '/progress/update/' + record.id}__}"
                  method="post" class="form">

                <div th:if="${record.id == null}" class="field--select field">
                    <label for="routineId">Rutina *</label>
                    <select id="routineId" name="routineId" required>
                        <option value="" disabled selected>— Selecciona una rutina —</option>
                        <option th:each="r : ${routines}"
                                th:value="${r.id}"
                                th:text="${r.routineName}"></option>
                    </select>
                </div>

                <div class="field">
                    <input type="text" id="exerciseName" name="exerciseName"
                           placeholder=" " th:value="${record.exerciseName}">
                    <label for="exerciseName">Nombre del ejercicio</label>
                </div>

                <div class="field">
                    <input type="date" id="date" name="date"
                           placeholder=" "
                           th:value="${record.date != null ? #dates.format(record.date, 'yyyy-MM-dd') : ''}">
                    <label for="date">Fecha</label>
                </div>

                <div class="field">
                    <input type="text" id="time" name="time"
                           placeholder=" " th:value="${record.time}"
                           list="time-suggestions" autocomplete="off">
                    <label for="time">Hora</label>
                </div>
                <datalist id="time-suggestions">
                    <option value="06:00"/><option value="07:00"/><option value="08:00"/>
                    <option value="09:00"/><option value="10:00"/><option value="12:00"/>
                    <option value="14:00"/><option value="16:00"/><option value="18:00"/>
                    <option value="19:00"/><option value="20:00"/><option value="21:00"/>
                </datalist>

                <div class="field">
                    <input type="number" id="series" name="series"
                           placeholder=" " th:value="${record.series}">
                    <label for="series">Series</label>
                </div>

                <div class="field">
                    <input type="number" id="repetitions" name="repetitions"
                           placeholder=" " th:value="${record.repetitions}">
                    <label for="repetitions">Repeticiones</label>
                </div>

                <div class="field">
                    <input type="number" id="weight" name="weight"
                           placeholder=" " step="0.5" th:value="${record.weight}">
                    <label for="weight">Peso (kg)</label>
                </div>

                <div class="field">
                    <input type="text" id="equipmentUsed" name="equipmentUsed"
                           placeholder=" " th:value="${record.equipmentUsed}">
                    <label for="equipmentUsed">Equipo utilizado</label>
                </div>

                <div class="field field--textarea">
                    <textarea id="progressNotes" name="progressNotes" rows="3"
                              placeholder=" " maxlength="400" data-counter
                              th:text="${record.progressNotes}"></textarea>
                    <label for="progressNotes">Notas de progreso</label>
                    <span class="char-counter"></span>
                </div>

                <button type="submit" class="btn"
                        th:text="${record.id == null ? 'Guardar registro' : 'Actualizar registro'}">Guardar</button>
            </form>

        </section>
    </main>

</div>

<script>
(function () {
    document.querySelectorAll('textarea[data-counter]').forEach(function (ta) {
        var wrapper = ta.closest('.field--textarea');
        var counter = wrapper ? wrapper.querySelector('.char-counter') : null;
        if (!counter) return;
        var max = ta.maxLength > 0 ? ta.maxLength : 500;
        function update() {
            var len = ta.value.length;
            counter.textContent = len + ' / ' + max;
            counter.classList.toggle('near-limit', len >= max * 0.9);
        }
        ta.addEventListener('input', update);
        update();
    });
})();
</script>

</body>
</html>

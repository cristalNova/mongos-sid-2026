<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones enviadas</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>
        <div class="user-list">

            <div style="padding:1rem 0; display:flex; justify-content:space-between; align-items:center; gap:1rem;">
                <h2 style="margin:0;">Recomendaciones enviadas</h2>
                <div style="display:flex; gap:0.5rem;">
                    <a th:href="@{/recommendation/list}" class="btn-small">Ver recibidas</a>
                    <a th:href="@{/recommendation/new}" class="btn-small">+ Nueva</a>
                </div>
            </div>

            <div class="user-row" th:each="rec : ${recommendations}">
                <div class="info">
                    <strong th:text="${rec.message}"></strong>
                    <small th:text="'Para: ' + ${rec.receiver.firstName + ' ' + rec.receiver.lastName}"></small>
                    <small th:text="${rec.date != null ? #dates.format(rec.date,'dd/MM/yyyy') : ''}"></small>
                </div>
                <div class="actions">
                    <form th:action="@{'/recommendation/delete/' + ${rec.id}}" method="post">
                        <button class="danger" onclick="return confirm('¿Eliminar recomendación?')">Eliminar</button>
                    </form>
                </div>
            </div>

            <p th:if="${#lists.isEmpty(recommendations)}" style="color:#888; padding:1rem;">
                No has enviado recomendaciones.
            </p>

        </div>
    </main>

</div>

</body>
</html>

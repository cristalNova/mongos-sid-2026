<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${exercise.id == null ? 'Nuevo ejercicio' : 'Editar ejercicio'}">Ejercicio</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1 th:text="${exercise.id == null ? 'Nuevo ejercicio' : 'Editar ejercicio'}">Ejercicio</h1>
        <a th:href="@{/exercise/list}" class="btn-small">← Volver</a>
    </header>

    <main>
        <section class="card card--form">

            <form th:action="@{__${exercise.id == null ? '/exercise/create' : '/exercise/update/' + exercise.id}__}"
                  method="post" class="form">

                <div class="field">
                    <input type="text" id="exerciseName" name="exerciseName"
                           placeholder=" " th:value="${exercise.exerciseName}" required>
                    <label for="exerciseName">Nombre del ejercicio *</label>
                </div>

                <div class="field field--textarea">
                    <textarea id="description" name="description" rows="3"
                              placeholder=" " maxlength="500" data-counter
                              th:text="${exercise.description}"></textarea>
                    <label for="description">Descripción</label>
                    <span class="char-counter"></span>
                </div>

                <div class="field">
                    <input type="text" id="type" name="type"
                           placeholder=" " th:value="${exercise.type}"
                           list="exercise-types" autocomplete="off">
                    <label for="type">Tipo</label>
                </div>
                <datalist id="exercise-types">
                    <option value="Cardio"/>
                    <option value="Fuerza"/>
                    <option value="Movilidad"/>
                    <option value="Flexibilidad"/>
                    <option value="HIIT"/>
                    <option value="Resistencia"/>
                    <option value="Equilibrio"/>
                </datalist>

                <div class="field">
                    <input type="text" id="difficultyType" name="difficultyType"
                           placeholder=" " th:value="${exercise.difficultyType}"
                           list="difficulty-levels" autocomplete="off">
                    <label for="difficultyType">Nivel de dificultad</label>
                </div>
                <datalist id="difficulty-levels">
                    <option value="FÁCIL"/>
                    <option value="MEDIO"/>
                    <option value="DIFÍCIL"/>
                </datalist>

                <div class="field">
                    <input type="number" id="duration" name="duration"
                           placeholder=" " step="0.1" th:value="${exercise.duration}">
                    <label for="duration">Duración (minutos)</label>
                </div>

                <button type="submit" class="btn"
                        th:text="${exercise.id == null ? 'Crear ejercicio' : 'Actualizar ejercicio'}">Guardar</button>
            </form>

        </section>
    </main>

</div>

<script>
(function () {
    document.querySelectorAll('textarea[data-counter]').forEach(function (ta) {
        var wrapper = ta.closest('.field--textarea');
        var counter = wrapper ? wrapper.querySelector('.char-counter') : null;
        if (!counter) return;
        var max = ta.maxLength > 0 ? ta.maxLength : 500;
        function update() {
            var len = ta.value.length;
            counter.textContent = len + ' / ' + max;
            counter.classList.toggle('near-limit', len >= max * 0.9);
        }
        ta.addEventListener('input', update);
        update();
    });
})();
</script>

</body>
</html>

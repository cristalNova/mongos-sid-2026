<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios</title>
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <div th:replace="fragments/topbar :: topbar(${userName})"></div>

    <main>

        <div class="user-list">

            <div class="list-header">
                <h2>Ejercicios</h2>
                <a sec:authorize="hasAuthority('MANAGE_USERS')"
                   th:href="@{/exercise/new}" class="btn-small">+ Nuevo ejercicio</a>
            </div>

            <form class="search-bar" method="get" th:action="@{/exercise/list}">
                <input type="search" name="q" th:value="${q}" placeholder="Buscar por nombre…" autocomplete="off">
                <button type="submit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Buscar
                </button>
                <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/exercise/list}" class="clear-search">Limpiar</a>
            </form>

            <p th:if="${q != null and !#strings.isEmpty(q)}" class="search-results-info"
               th:text="'Resultados para: «' + ${q} + '»  (' + ${#lists.size(exercises)} + ' encontrados)'"></p>

            <div class="user-row" th:each="exercise : ${exercises}">

                <div class="info">
                    <strong th:text="${exercise.exerciseName}"></strong>
                    <small th:text="${exercise.type + ' · ' + exercise.difficultyType}"></small>
                    <small th:text="${exercise.description}"></small>
                </div>

                <div class="roles">
                    <span class="chip" th:text="${exercise.duration != null ? exercise.duration + ' min' : '—'}"></span>
                </div>

                <div class="actions">
                    <a sec:authorize="hasAuthority('MANAGE_USERS')"
                       th:href="@{'/exercise/edit/' + ${exercise.id}}" class="btn-small">Editar</a>

                    <a sec:authorize="hasAuthority('MANAGE_USERS')"
                       th:href="@{'/exercise/' + ${exercise.id} + '/visual-supports'}" class="btn-small">Videos</a>

                    <form sec:authorize="hasAuthority('MANAGE_USERS')"
                          th:action="@{'/exercise/delete/' + ${exercise.id}}" method="post">
                        <button type="button" class="danger"
                                data-confirm="¿Eliminar este ejercicio? Esta acción no se puede deshacer.">
                            Eliminar
                        </button>
                    </form>
                </div>

            </div>

            <div th:if="${#lists.isEmpty(exercises)}"
                 th:replace="fragments/empty-state :: empty('No hay ejercicios registrados.', 'Crea el primero usando el botón de arriba.')">
            </div>

        </div>

    </main>

</div>

</body>
</html>

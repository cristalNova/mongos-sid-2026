<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Videos / Apoyos visuales</title>
    <link rel="stylesheet" th:href="@{/css/user-detail.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<div class="page-wrapper">

    <header class="topbar">
        <h1>Apoyos visuales — <span th:text="${exercise.exerciseName}"></span></h1>
        <a th:href="@{/exercise/list}" class="btn-small">Volver</a>
    </header>

    <main>
        <section class="card">

            <h2>Apoyos registrados</h2>
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left; padding:0.5rem; border-bottom:1px solid #ddd;">Tipo</th>
                        <th style="text-align:left; padding:0.5rem; border-bottom:1px solid #ddd;">URL</th>
                        <th style="padding:0.5rem; border-bottom:1px solid #ddd;"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="vs, stat : ${exercise.visualSupports}">
                        <td style="padding:0.5rem;" th:text="${vs.supportType}"></td>
                        <td style="padding:0.5rem;">
                            <a th:href="${vs.url}" target="_blank" th:text="${vs.url}"></a>
                        </td>
                        <td style="padding:0.5rem;">
                            <form th:action="@{'/exercise/' + ${exercise.id} + '/visual-supports/remove/' + ${stat.index}}"
                                  method="post">
                                <button class="danger" onclick="return confirm('¿Eliminar apoyo visual?')">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(exercise.visualSupports)}">
                        <td colspan="3" style="padding:1rem; color:#888;">Sin apoyos visuales.</td>
                    </tr>
                </tbody>
            </table>

            <hr style="margin: 1.5rem 0;">

            <h2>Agregar apoyo visual</h2>
            <form th:action="@{'/exercise/' + ${exercise.id} + '/visual-supports/add'}"
                  method="post" class="form">
                <label>Tipo (ej: video, imagen)</label>
                <input type="text" name="supportType" required>

                <label>URL</label>
                <input type="url" name="url" required>

                <button type="submit" class="btn">Agregar</button>
            </form>

        </section>
    </main>

</div>

</body>
</html>

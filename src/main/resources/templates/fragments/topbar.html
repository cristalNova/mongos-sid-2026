<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<body>

<header class="topbar" th:fragment="topbar(userName)">

    <nav class="nav-tabs">
        <a th:href="@{/user}" class="tab dashboard">Dashboard</a>

        <a sec:authorize="hasAuthority('VIEW_USERS')"
           th:href="@{/user/list}" class="tab users">Usuarios</a>

        <a th:href="@{/exercise/list}" class="tab exercises">Ejercicios</a>

        <a th:href="@{/routine/list}" class="tab">Rutinas</a>

        <a th:href="@{/event/list}" class="tab">Eventos</a>

        <a th:href="@{/progress/list}" class="tab">Mi progreso</a>

        <a th:href="@{/progress/stats}" class="tab">Estadísticas</a>

        <a th:href="@{/recommendation/list}" class="tab">Recomendaciones</a>

        <a sec:authorize="hasAuthority('VIEW_USERS')"
           th:href="@{/user/my-students}" class="tab">Mis estudiantes</a>

        <a sec:authorize="hasAuthority('MANAGE_ROLES')"
           th:href="@{/role/view}" class="tab">Roles</a>

        <a sec:authorize="hasAuthority('MANAGE_PERMISSIONS')"
           th:href="@{/permission/view}" class="tab permisos">Permisos</a>
    </nav>

    <div class="user-box">
        <span th:text="${userName}">Nombre</span>

        <div class="avatar">
            <img th:src="@{/img/Group-45.svg}" alt="user avatar" class="avatar-img">
        </div>
    </div>

</header>

</body>
</html>

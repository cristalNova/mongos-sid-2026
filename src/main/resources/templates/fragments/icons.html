<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Fragmento de iconos SVG — FitCampus
  Uso del sprite:   th:replace="fragments/icons :: sprite"    (una vez, al inicio del <body>)
  Uso de un icono:  th:replace="fragments/icons :: icon('home')"
-->

<!-- ============================================================
     SPRITE: incluir UNA VEZ en el <body> de cada plantilla.
     Los <symbol> son invisibles; se referencian con <use>.
============================================================ -->
<svg th:fragment="sprite"
     xmlns="http://www.w3.org/2000/svg"
     style="display:none" aria-hidden="true">
    <defs>

        <!-- home -->
        <symbol id="icon-home" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 9 12 2 21 9 21 22 3 22 3 9"/>
            <rect x="9" y="14" width="6" height="8"/>
        </symbol>

        <!-- users (personas) -->
        <symbol id="icon-users" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </symbol>

        <!-- dumbbell (pesas) -->
        <symbol id="icon-dumbbell" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6.5" y1="12" x2="17.5" y2="12"/>
            <rect x="3" y="9" width="3.5" height="6" rx="1"/>
            <rect x="17.5" y="9" width="3.5" height="6" rx="1"/>
        </symbol>

        <!-- list (rutinas) -->
        <symbol id="icon-list" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
        </symbol>

        <!-- calendar (eventos) -->
        <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </symbol>

        <!-- bar-chart (progreso / estadísticas) -->
        <symbol id="icon-chart" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
            <line x1="3" y1="20" x2="21" y2="20"/>
        </symbol>

        <!-- star (recomendaciones) -->
        <symbol id="icon-star" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </symbol>

        <!-- shield (roles) -->
        <symbol id="icon-shield" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </symbol>

        <!-- key (permisos) -->
        <symbol id="icon-key" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </symbol>

        <!-- plus -->
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </symbol>

        <!-- edit (lápiz) -->
        <symbol id="icon-edit" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </symbol>

        <!-- trash (eliminar) -->
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </symbol>

        <!-- check -->
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </symbol>

        <!-- x (cerrar / error) -->
        <symbol id="icon-x" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </symbol>

        <!-- search (lupa) -->
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </symbol>

        <!-- log-out -->
        <symbol id="icon-logout" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </symbol>

        <!-- arrow-left (volver) -->
        <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </symbol>

        <!-- graduation-cap (trainer / estudiante) -->
        <symbol id="icon-graduation" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </symbol>

        <!-- activity (progreso / actividad) -->
        <symbol id="icon-activity" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </symbol>

    </defs>
</svg>

<!-- ============================================================
     FRAGMENTO DE USO: emite un <svg> que referencia el sprite.
     Ejemplo: <div th:replace="fragments/icons :: icon('home')"></div>
============================================================ -->
<svg th:fragment="icon(name)"
     xmlns="http://www.w3.org/2000/svg"
     class="icon" aria-hidden="true">
    <use th:href="'#icon-' + ${name}"/>
</svg>

</html>
